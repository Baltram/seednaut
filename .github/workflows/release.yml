name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v6

      - name: Install musl-tools (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false # Workaround for potentially broken macOS runner image

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "23.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          DIR="seednaut-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$DIR"
          cp target/${{ matrix.target }}/release/seednaut "$DIR/"
          cp README.md LICENSE-APACHE.txt LICENSE-MIT.txt "$DIR/"
          tar -czf "${DIR}.tar.gz" "$DIR"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $DirName = "seednaut-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $DirName
          Copy-Item -Path "target/${{ matrix.target }}/release/seednaut.exe" -Destination "$DirName/"
          Copy-Item -Path "README.md", "LICENSE-APACHE.txt", "LICENSE-MIT.txt" -Destination "$DirName/"
          Compress-Archive -Path "$DirName" -DestinationPath "${DirName}.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: seednaut-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true

      - name: Generate Checksums
        run: sha256sum seednaut-* > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            seednaut-*
            SHA256SUMS.txt